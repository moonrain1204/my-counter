<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>九字禪計數器 v7.2</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #F5F5DC; 
            font-family: sans-serif; user-select: none; touch-action: none;
            position: fixed; /* 鎖定版面防止跳動 */
        }
        
        #global-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; background: transparent; cursor: pointer; }

        /* 內容層 */
        .content-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; align-items: center; justify-content: center; z-index: 5; overflow: hidden; }
        .content-area.active { display: flex; }

        .movable { will-change: transform; pointer-events: none; position: absolute; }
        #text-p1 { color: #8B4513; font-family: "標楷體", serif; font-size: 32px; font-weight: 900; white-space: nowrap; }
        #buddha-img { max-height: 80vh; }
        #scripture-p3 { padding: 30px; text-align: center; color: #8B4513; width: 350px; }
        .scripture-header { font-size: 26px; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #8B4513; display: inline-block; }
        .scripture-content { font-size: 19px; line-height: 1.6; text-align: justify; }

        /* 數字層：獨立感應區 */
        #counter-movable { 
            color: #00008B; font-size: 90px; font-weight: bold; 
            text-shadow: 2px 2px 4px rgba(255,255,255,0.5); z-index: 60; 
            padding: 10px 20px; border-radius: 15px;
        }

        /* UI 元件層 */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
        
        #audio-btns { position: absolute; left: 15px; bottom: 100px; display: flex; flex-direction: column; gap: 15px; pointer-events: auto; }
        .btn { width: 44px; height: 44px; background: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 1px solid #8B4513; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        #nav-btns { position: absolute; bottom: 75px; width: 100%; display: flex; justify-content: center; gap: 10px; pointer-events: auto; }
        .nav-btn { padding: 8px 18px; background: rgba(139, 69, 19, 0.85); color: white; border-radius: 20px; font-size: 14px; border: none; }
        
        /* 目標資訊：解決鍵盤遮擋，改為較高位置 */
        #target-info { 
            position: absolute; right: 15px; bottom: 15px; 
            text-align: right; pointer-events: auto; color: #8b8b7a; font-size: 12px; 
            background: rgba(245, 245, 220, 0.8); padding: 8px; border-radius: 8px;
            z-index: 110;
        }
        #target-input { background: transparent; border: none; border-bottom: 1px solid #8B4513; width: 60px; color: #8B4513; font-weight: bold; text-align: center; outline: none; }

        #log-toggle { position: absolute; right: 20px; top: 20px; width: 25px; height: 25px; background: rgba(112, 128, 144, 0.4); border-radius: 50%; cursor: pointer; pointer-events: auto; }

        #progress-bar { position: absolute; top: 0; left: 0; height: 5px; width: 0%; z-index: 500; pointer-events: none; }
        #progress-bar.active { background: #FF4500; transition: width 0.8s linear; width: 100% !important; }
    </style>
</head>
<body>
    <div id="progress-bar"></div>

    <div id="p1" class="content-area active"><div id="text-p1" class="movable">南無本師大自在王佛</div></div>
    <div id="p2" class="content-area"><img src="buddha.png" id="buddha-img" class="movable"></div>
    <div id="p3" class="content-area">
        <div id="scripture-p3" class="movable">
            <div class="scripture-header">大自在王佛讚頌</div>
            <div class="scripture-content">大自在王佛為眾生佛性之本元，諸佛法身之總理體，統物理界精神界之一如，法界萬有皆由之變易生化而然，其身心體、相、智、德、理、事、能、用、時、空之十大一如，與法界同一理量。</div>
        </div>
    </div>

    <div id="counter-movable" class="movable">0</div>
    <div id="global-layer"></div>

    <div id="ui-layer">
        <div id="log-toggle" onclick="openLog()"></div>
        <div id="audio-btns">
            <div class="btn" onclick="actAudio('play')"><div style="width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 12px solid #8B4513; margin-left: 4px;"></div></div>
            <div class="btn" onclick="actAudio('pause')"><div style="width: 12px; height: 14px; border-left: 4px solid #8B4513; border-right: 4px solid #8B4513;"></div></div>
        </div>
        <div id="nav-btns">
            <button class="nav-btn" onclick="goPage(1)">九字禪</button>
            <button class="nav-btn" onclick="goPage(2)">佛像</button>
            <button class="nav-btn" onclick="goPage(3)">讚頌</button>
        </div>
        <div id="target-info">
            目標: <input type="number" id="target-input" placeholder="設定" onfocus="this.placeholder=''" onblur="this.placeholder='設定'" oninput="updateUI()">
            <div id="est-time">預計: --/-- --:--</div>
        </div>
    </div>

    <audio id="buddhaAudio" loop><source src="buddha_chant.mp3" type="audio/mpeg"></audio>

    <script>
        let count = parseInt(localStorage.getItem('myCounter')) || 0;
        let activePage = 1;
        let state = {
            num: { x: 0, y: 150, s: 1 },
            p1:  { x: 0, y: -150, s: 1 },
            p2:  { x: 0, y: -50, s: 1 },
            p3:  { x: 0, y: -100, s: 1 }
        };

        // 解決鍵盤推擠問題
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                document.body.style.height = window.visualViewport.height + 'px';
                window.scrollTo(0, 0);
            });
        }

        function updateUI() {
            document.getElementById('counter-movable').innerText = count;
            localStorage.setItem('myCounter', count);
            const target = document.getElementById('target-input').value;
            if(target && target > count) {
                const finishDate = new Date(Date.now() + (target - count) * 1200);
                document.getElementById('est-time').innerText = `預計: ${finishDate.getMonth()+1}/${finishDate.getDate()} ${finishDate.getHours()}:${finishDate.getMinutes().toString().padStart(2,'0')}`;
            } else { document.getElementById('est-time').innerText = "預計: --/-- --:--"; }
        }

        function goPage(n) {
            activePage = n;
            document.querySelectorAll('.content-area').forEach(e => e.classList.remove('active'));
            document.getElementById('p' + n).classList.add('active');
            applyTransforms();
        }

        function actAudio(a) {
            const ad = document.getElementById('buddhaAudio');
            if(a==='play') ad.play(); else ad.pause();
        }

        const layer = document.getElementById('global-layer');
        let startT, lastX, lastY, startD, isAdjusting = false, touchMoved = false, targetObj = 'bg';

        layer.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startT = Date.now();
            touchMoved = false;

            // 判斷觸碰點是否在數字附近 (獨立縮放邏輯)
            const touch = e.touches[0];
            const numEl = document.getElementById('counter-movable').getBoundingClientRect();
            const isNearNum = (touch.clientX > numEl.left - 50 && touch.clientX < numEl.right + 50 &&
                               touch.clientY > numEl.top - 50 && touch.clientY < numEl.bottom + 50);
            targetObj = isNearNum ? 'num' : 'bg';

            if(e.touches.length >= 2) {
                isAdjusting = true;
                startD = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            } else {
                lastX = touch.pageX; lastY = touch.pageY;
                isAdjusting = false;
            }
        }, {passive: false});

        layer.addEventListener('touchmove', (e) => {
            if(e.touches.length >= 2) {
                isAdjusting = true;
                const d = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                const ratio = d / startD;
                
                // 根據起始判斷決定縮放對象
                if(targetObj === 'num') {
                    state.num.s *= ratio;
                } else {
                    state['p'+activePage].s *= ratio;
                }
                startD = d;
                applyTransforms();
            } else if(e.touches.length === 1 && !isAdjusting) {
                const dx = e.touches[0].pageX - lastX;
                const dy = e.touches[0].pageY - lastY;
                if(Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                    touchMoved = true;
                    if(targetObj === 'num') {
                        state.num.x += dx; state.num.y += dy;
                    } else {
                        state['p'+activePage].x += dx; state['p'+activePage].y += dy;
                    }
                    lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
                    applyTransforms();
                }
            }
        });

        layer.addEventListener('touchend', (e) => {
            if(e.touches.length === 0) {
                if(!isAdjusting && !touchMoved && (Date.now() - startT < 300)) {
                    count++; updateUI();
                }
                isAdjusting = false; touchMoved = false;
            }
        });

        function applyTransforms() {
            document.getElementById('counter-movable').style.transform = `translate(${state.num.x}px, ${state.num.y}px) scale(${state.num.s})`;
            const currentElId = ['text-p1', 'buddha-img', 'scripture-p3'][activePage-1];
            const s = state['p'+activePage];
            document.getElementById(currentElId).style.transform = `translate(${s.x}px, ${s.y}px) scale(${s.s})`;
        }

        document.getElementById('target-input').value = localStorage.getItem('myTarget') || "";
        updateUI(); applyTransforms();
    </script>
</body>
</html>
