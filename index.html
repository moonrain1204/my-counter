<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>九字禪計數器 v4.4</title>
    <style>
        /* 基礎設定 */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #F5F5DC; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            user-select: none; touch-action: none; 
        }
        
        /* 頂部控制列 */
        #header-controls { 
            position: absolute; top: 15px; width: 100%; padding: 0 10px; 
            display: flex; justify-content: space-around; align-items: center; z-index: 100; 
        }
        
        /* 聖號：優化字體順序，增加備用字體確保不崩潰 */
        #sacred-text { 
            color: #8B4513; 
            font-family: "華康特粗楷體", "DFKai-SB", "DFKaiShu-W7", "標楷體", "STKaiti", serif; 
            font-size: 19px; font-weight: 900; letter-spacing: 2.2px; 
            -webkit-text-stroke: 0.8px #8B4513; 
            text-shadow: 0.5px 0.5px 1px rgba(255,255,255,0.5);
            line-height: 1.2; white-space: nowrap; margin-left: 12px;
            display: block !important; /* 強制顯示 */
        }
        
        #log-toggle { 
            padding: 8px 14px; background: rgba(112, 128, 144, 0.4); 
            color: #444; border: 1px solid rgba(0,0,0,0.1); border-radius: 20px; 
            font-size: 12px; cursor: pointer; backdrop-filter: blur(3px); 
            white-space: nowrap; display: flex; align-items: center;
        }

        /* 數字顯示層 */
        #display-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; justify-content: center; align-items: center; 
            pointer-events: none; z-index: 1; 
        }
        #counter { color: #00008B; font-size: 100px; font-weight: bold; transition: transform 0.1s ease-out; }
        
        /* 紀錄面板 */
        #log-panel { 
            position: absolute; top: 0; right: -100%; width: 100%; height: 100%; 
            background: #fff; z-index: 150; transition: right 0.3s ease-out; 
            padding: 20px; overflow-y: auto; 
        }
        #log-panel.active { right: 0; }
        
        /* 觸控層 */
        #control-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; background: transparent; }
        
        /* 提示文字 */
        .ui-text { position: absolute; width: 100%; text-align: center; pointer-events: none; z-index: 5; }
        .hint { bottom: 60px; color: #8b8b7a; font-size: 14px; }
        .version { bottom: 10px; left: 10px; color: #bcbcad; font-size: 10px; width: auto; text-align: left; }
        
        /* 進度條 */
        #progress-bar { position: absolute; top: 0; left: 0; height: 6px; background-color: transparent; width: 0%; z-index: 200; }
        #progress-bar.active { background-color: #FF4500; transition: width 0.8s linear; width: 100% !important; }
    </style>
</head>
<body>
    <div id="progress-bar"></div>
    <div id="header-controls">
        <div id="sacred-text">南無本師大自在王佛</div>
        <div id="log-toggle">查看紀錄清單</div>
    </div>

    <div id="display-layer"><div id="counter">0</div></div>
    
    <div id="control-layer"></div>

    <div id="log-panel">
        <div id="log-close" style="text-align:right; font-size:35px; cursor:pointer; padding:10px;">✕</div>
        <div style="font-size:20px; font-weight:bold; border-bottom:3px solid #708090; padding-bottom:10px; margin-bottom:15px;">九字禪 修持歷程</div>
        <div id="log-content"></div>
    </div>

    <div class="ui-text hint">雙指縮放數字 / 長按 3.5秒 語音歸零</div>
    <div class="ui-text version">v4.4 穩定修復版</div>

    <script>
        // 初始化檢查，確保 localStorage 正常
        let count = 0;
        let history = [];
        try {
            count = parseInt(localStorage.getItem('myCounter')) || 0;
            history = JSON.parse(localStorage.getItem('myHistory')) || [];
        } catch (e) { console.error("Storage error", e); }

        const counter = document.getElementById('counter');
        const logContent = document.getElementById('log-content');

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                speechSynthesis.speak(utterance);
            }
        }

        function updateDisplay() {
            counter.innerText = count;
            localStorage.setItem('myCounter', count);
            if (count > 0 && count % 500 === 0) saveToHistory();
        }

        function saveToHistory() {
            const now = new Date();
            const timeStr = `2025/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
            history.unshift({ count: count, time: timeStr });
            localStorage.setItem('myHistory', JSON.stringify(history));
        }

        function renderHistory() {
            logContent.innerHTML = history.map(item => `
                <div style="border-bottom:1px solid #eee; padding:12px 0;">
                    <div style="display:flex; justify-content:space-between; font-size:13px; color:#888;">
                        <span style="color:#708090; font-weight:bold;">達標</span>
                        <span>${item.time}</span>
                    </div>
                    <div style="font-size:26px; font-weight:bold; color:#333; margin-top:5px;">${item.count}</div>
                </div>`).join('');
        }

        document.getElementById('log-toggle').onclick = () => { 
            document.getElementById('log-panel').classList.add('active'); 
            renderHistory(); 
        };
        document.getElementById('log-close').onclick = () => { 
            document.getElementById('log-panel').classList.remove('active'); 
        };

        // 觸控邏輯修正
        let currentScale = 1, startScale = 1, initialDist = 0;
        let holdTimer, visualTimer, isHolding = false, isPinching = false, startTime = 0;

        const control = document.getElementById('control-layer');
        control.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startTime = Date.now();
            if (e.touches.length === 1) { 
                isPinching = false; 
                isHolding = true;
                holdTimer = setTimeout(() => {
                    if (isHolding && !isPinching) {
                        speak("請問是否要歸零？");
                        setTimeout(() => {
                            if (confirm("確定要將目前數字歸零嗎？")) {
                                count = 0; updateDisplay();
                            }
                        }, 100);
                    }
                    isHolding = false;
                    document.getElementById('progress-bar').classList.remove('active');
                }, 3500);
                visualTimer = setTimeout(() => { 
                    if(isHolding) document.getElementById('progress-bar').classList.add('active'); 
                }, 2800);
            } else if (e.touches.length === 2) {
                isPinching = true;
                isHolding = false;
                clearTimeout(holdTimer);
                initialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                startScale = currentScale;
            }
        }, { passive: false });

        control.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                currentScale = Math.min(Math.max(startScale * (dist / initialDist), 0.2), 8);
                counter.style.transform = `scale(${currentScale})`;
            }
        });

        control.addEventListener('touchend', (e) => {
            if (!isPinching && (Date.now() - startTime) < 400) { 
                count++; updateDisplay(); 
                if(navigator.vibrate) navigator.vibrate(40);
            }
            isHolding = false;
            clearTimeout(holdTimer);
            clearTimeout(visualTimer);
            document.getElementById('progress-bar').classList.remove('active');
        });

        updateDisplay();
    </script>
</body>
</html>
