<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>九字禪計數器 v6.8</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #F5F5DC; font-family: sans-serif; user-select: none; touch-action: none; }
        
        /* 全域感應層：z-index 設為 50 */
        #global-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; background: transparent; cursor: pointer; }

        /* 內容區 */
        .content-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; align-items: center; justify-content: center; z-index: 5; overflow: hidden; }
        .content-area.active { display: flex; }

        .movable { will-change: transform; pointer-events: none; transition: transform 0.05s linear; }
        #sacred-text-movable { color: #8B4513; font-family: "標楷體", serif; font-size: 32px; font-weight: 900; letter-spacing: 2px; text-align: center; white-space: nowrap; }
        #buddha-img { max-height: 80%; }

        .scripture-box { padding: 40px; text-align: center; color: #8B4513; pointer-events: none; max-width: 600px; }
        .scripture-header { font-size: 26px; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #8B4513; display: inline-block; padding-bottom: 5px; }
        .scripture-content { font-size: 20px; line-height: 1.8; text-align: justify; }

        /* UI 層：z-index 設為 100 以上以確保可點擊 */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
        #counter-wrap { position: absolute; top: 65%; left: 50%; transform: translate(-50%, -50%); display: flex; justify-content: center; align-items: center; }
        #counter { color: #00008B; font-size: 90px; font-weight: bold; text-shadow: 2px 2px 4px rgba(255,255,255,0.5); }

        #log-toggle { position: absolute; right: 20px; top: 20px; width: 20px; height: 20px; background: rgba(112, 128, 144, 0.4); border-radius: 50%; cursor: pointer; pointer-events: auto; border: 1px solid rgba(0,0,0,0.1); }
        
        #log-panel { position: absolute; top: 0; right: -100%; width: 100%; height: 100%; background: #fff; z-index: 2000; transition: right 0.3s ease-out; padding: 20px; overflow-y: auto; pointer-events: auto; }
        #log-panel.active { right: 0; }

        #audio-btns { position: absolute; left: 15px; bottom: 100px; display: flex; flex-direction: column; gap: 15px; pointer-events: auto; }
        #nav-btns { position: absolute; bottom: 75px; width: 100%; display: flex; justify-content: center; gap: 10px; pointer-events: auto; }
        .nav-btn { padding: 8px 20px; background: rgba(139, 69, 19, 0.8); color: white; border-radius: 20px; font-size: 14px; cursor: pointer; border: none; }
        
        .btn { width: 44px; height: 44px; background: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 1px solid #8B4513; cursor: pointer; }
        .icon-play { width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 12px solid #8B4513; margin-left: 4px; }
        .icon-pause { width: 12px; height: 14px; border-left: 4px solid #8B4513; border-right: 4px solid #8B4513; }
        .icon-stop { width: 12px; height: 12px; background: #8B4513; }

        .bottom-info { position: absolute; bottom: 15px; left: 20px; pointer-events: auto; color: #8b8b7a; font-size: 13px; }
        #target-input { background: transparent; border: none; border-bottom: 1px solid #bcbcad; width: 80px; color: #8B4513; font-weight: bold; text-align: center; outline: none; }

        #progress-bar { position: absolute; top: 0; left: 0; height: 5px; width: 0%; z-index: 500; pointer-events: none; }
        #progress-bar.active { background: #FF4500; transition: width 0.8s linear; width: 100% !important; }
    </style>
</head>
<body>
    <div id="progress-bar"></div>

    <div id="p1" class="content-area active"><div id="sacred-text-movable" class="movable">南無本師大自在王佛</div></div>
    <div id="p2" class="content-area"><img src="buddha.png" id="buddha-img" class="movable"></div>
    <div id="p3" class="content-area">
        <div class="scripture-box">
            <div class="scripture-header">大自在王佛讚頌</div>
            <div class="scripture-content">大自在王佛為眾生佛性之本元，諸佛法身之總理體，統物理界精神界之一如，法界萬有皆由之變易生化而然，其身心體、相、智、德、理、事、能、用、時、空之十大一如，與法界同一理量。</div>
        </div>
    </div>

    <div id="global-layer"></div>

    <div id="ui-layer">
        <div id="log-toggle" onclick="openLog()"></div>
        <div id="counter-wrap"><div id="counter">0</div></div>
        <div id="audio-btns">
            <div class="btn" onclick="actAudio('play')"><div class="icon-play"></div></div>
            <div class="btn" onclick="actAudio('pause')"><div class="icon-pause"></div></div>
            <div class="btn" onclick="actAudio('stop')"><div class="icon-stop"></div></div>
        </div>
        <div id="nav-btns">
            <button class="nav-btn" onclick="goPage(1)">文字</button>
            <button class="nav-btn" onclick="goPage(2)">佛像</button>
            <button class="nav-btn" onclick="goPage(3)">讚頌</button>
        </div>
        <div class="bottom-info">
            目標: <input type="number" id="target-input" oninput="updateUI()"> <span id="est"></span><br>
            v6.8 完整修正版
        </div>
    </div>

    <div id="log-panel">
        <div onclick="closeLog()" style="text-align:right; font-size:30px; cursor:pointer;">✕</div>
        <div id="log-content" style="margin-top:20px;"></div>
        <button onclick="clearHistory()" style="width:100%; margin-top:30px; padding:15px; background:#ff4444; color:white; border:none; border-radius:10px; cursor:pointer;">清空歷史</button>
    </div>

    <audio id="buddhaAudio"><source src="buddha_chant.mp3" type="audio/mpeg"></audio>

    <script>
        let count = parseInt(localStorage.getItem('myCounter')) || 0;
        let history = JSON.parse(localStorage.getItem('myHistory')) || [];
        let isTouch = false, activePage = 1;
        let state = { p1: { x: 0, y: -150, s: 1 }, p2: { x: 0, y: -50, s: 1 } };

        const audio = document.getElementById('buddhaAudio');
        audio.addEventListener('ended', () => { audio.currentTime = 0; audio.play(); });

        function goPage(n) {
            activePage = n;
            document.querySelectorAll('.content-area').forEach(e => e.classList.remove('active'));
            document.getElementById('p' + n).classList.add('active');
        }

        function actAudio(a) {
            if(a==='play') audio.play();
            else if(a==='pause') audio.pause();
            else { audio.pause(); audio.currentTime = 0; }
        }

        function openLog() { 
            renderHistory();
            document.getElementById('log-panel').classList.add('active'); 
        }
        function closeLog() { document.getElementById('log-panel').classList.remove('active'); }
        
        function renderHistory() {
            const content = document.getElementById('log-content');
            content.innerHTML = history.length === 0 ? "尚無紀錄" : history.map(item => `<div style="padding:10px; border-bottom:1px solid #eee;">${item.count} - ${item.time}</div>`).join('');
        }

        function clearHistory() {
            if(confirm("確定清空所有歷史紀錄？")) {
                history = [];
                localStorage.setItem('myHistory', JSON.stringify(history));
                renderHistory();
            }
        }

        function updateUI() {
            document.getElementById('counter').innerText = count;
            localStorage.setItem('myCounter', count);
            localStorage.setItem('myTarget', document.getElementById('target-input').value);
            
            // 每 500 次存一次歷史
            if (count > 0 && count % 500 === 0 && (history.length === 0 || history[0].count !== count)) {
                const now = new Date();
                history.unshift({ count: count, time: `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}` });
                localStorage.setItem('myHistory', JSON.stringify(history));
            }
        }

        const layer = document.getElementById('global-layer');
        let startT = 0, holdT, visualT, lastX, lastY, startD, isMoving = false;

        layer.addEventListener('touchstart', (e) => {
            isTouch = true; e.preventDefault();
            document.getElementById('target-input').blur();
            startT = Date.now();
            isMoving = false;

            if(e.touches.length === 1) {
                lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
                holdT = setTimeout(() => { if(!isMoving && confirm("歸零？")) {count=0; updateUI();} }, 3500);
                visualT = setTimeout(() => { if(!isMoving) document.getElementById('progress-bar').classList.add('active'); }, 500);
            } else if(e.touches.length === 2) {
                isMoving = true;
                startD = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            }
        }, {passive: false});

        layer.addEventListener('touchmove', (e) => {
            const curState = state['p' + activePage];
            if(!curState) return;

            if(e.touches.length === 1) {
                const dx = e.touches[0].pageX - lastX;
                const dy = e.touches[0].pageY - lastY;
                if(Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                    isMoving = true;
                    curState.x += dx; curState.y += dy;
                    lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
                }
            } else if(e.touches.length === 2) {
                const d = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                curState.s *= (d / startD);
                startD = d;
            }

            if(isMoving) {
                const el = activePage === 1 ? document.getElementById('sacred-text-movable') : document.getElementById('buddha-img');
                if(el) el.style.transform = `translate(${curState.x}px, ${curState.y}px) scale(${curState.s})`;
                clearTimeout(holdT); clearTimeout(visualT);
                document.getElementById('progress-bar').classList.remove('active');
            }
        });

        layer.addEventListener('touchend', (e) => {
            if(!isMoving && (Date.now() - startT) < 300 && e.touches.length === 0) {
                count++; updateUI();
            }
            clearTimeout(holdT); clearTimeout(visualT);
            document.getElementById('progress-bar').classList.remove('active');
        });

        layer.addEventListener('mousedown', (e) => {
            if(isTouch) return;
            if(e.button === 0) { count++; updateUI(); }
            else if(e.button === 2) { if(confirm("歸零？")) {count=0; updateUI();} }
        });

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.getElementById('sacred-text-movable').style.transform = `translate(${state.p1.x}px, ${state.p1.y}px) scale(${state.p1.s})`;
        document.getElementById('buddha-img').style.transform = `translate(${state.p2.x}px, ${state.p2.y}px) scale(${state.p2.s})`;
        
        updateUI();
    </script>
</body>
</html>
