<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>專業計數器 v1.0</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; display: flex; justify-content: center;
            align-items: center; background-color: #F5F5DC; 
            color: #333; font-family: sans-serif;
            user-select: none; touch-action: none;
        }
        /* 數字容器：完全不阻擋點擊 */
        #counter-container {
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; 
            z-index: 1;
            transition: transform 0.1s ease-out;
        }
        #counter { 
            color: #00008B; 
            font-size: 8rem;
            font-weight: bold; 
        }
        .hint {
            position: absolute; bottom: 45px; text-align: center;
            color: #8b8b7a; font-size: 0.8rem; line-height: 1.5;
            pointer-events: none; z-index: 10;
        }
        .version { position: absolute; bottom: 10px; left: 10px; color: #bcbcad; font-size: 0.7rem; }
        
        #progress-bar {
            position: absolute; top: 0; left: 0; height: 6px;
            background-color: #4169E1; width: 0%; z-index: 100;
        }
        /* 新增：隱形的點擊捕獲層 */
        #click-surface {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; /* 確保在數字上方但低於進度條 */
        }
    </style>
</head>
<body>
    <div id="progress-bar"></div>
    <div id="click-surface"></div>
    <div id="counter-container">
        <div id="counter">0</div>
    </div>
    
    <div class="hint">點擊螢幕任何處 +1<br>雙指縮放數字大小<br>長按 3秒 歸零</div>
    <div class="version">v1.0</div>

    <script>
        let count = 0;
        let currentScale = 1;
        let startScale = 1;
        let initialDist = 0;
        let holdTimer = null;
        let isHolding = false;
        let isPinching = false;
        
        const counter = document.getElementById('counter');
        const container = document.getElementById('counter-container');
        const progressBar = document.getElementById('progress-bar');
        const surface = document.getElementById('click-surface');

        // --- 1. 計數邏輯：使用最穩定的 click ---
        surface.addEventListener('click', (e) => {
            // 如果剛結束縮放，不計數
            if (isPinching) return;
            
            count++;
            counter.innerText = count;
            if (navigator.vibrate) navigator.vibrate(20);
        });

        // --- 2. 歸零與縮放邏輯：使用觸碰事件 ---
        surface.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isPinching = false;
                startHolding();
            } else if (e.touches.length === 2) {
                isPinching = true;
                stopHolding();
                initialDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                startScale = currentScale;
            }
        }, { passive: false });

        surface.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const currentDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                currentScale = startScale * (currentDist / initialDist);
                // 限制範圍
                if (currentScale < 0.2) currentScale = 0.2;
                if (currentScale > 5) currentScale = 5;
                container.style.transform = `scale(${currentScale})`;
            }
        });

        surface.addEventListener('touchend', (e) => {
            stopHolding();
            // 延遲一小段時間才結束縮放狀態，避免縮放結束時觸發 click
            if (e.touches.length === 0) {
                setTimeout(() => { isPinching = false; }, 100);
            }
        });

        function startHolding() {
            isHolding = true;
            progressBar.style.transition = "width 3s linear";
            progressBar.style.width = "100%";
            holdTimer = setTimeout(() => {
                if (isHolding && !isPinching) {
                    if (confirm("v1.0：確定要歸零嗎？")) {
                        count = 0;
                        counter.innerText = count;
                        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                    }
                }
                stopHolding();
            }, 3000);
        }

        function stopHolding() {
            isHolding = false;
            clearTimeout(holdTimer);
            progressBar.style.transition = "none";
            progressBar.style.width = "0%";
        }
    </script>
</body>
</html>
