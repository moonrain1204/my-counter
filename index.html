<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>專業計數器 v1.1</title>
    <style>
        /* 移除所有複雜層級，回歸最基礎佈局 */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; 
            background-color: #F5F5DC; 
            font-family: sans-serif;
            user-select: none; touch-action: none;
        }

        /* 使用簡單的 flex 確保數字一定在正中央 */
        #main-stage {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #counter { 
            color: #00008B; 
            font-size: 120px; /* 使用像素單位避免縮放錯誤 */
            font-weight: bold;
            transition: transform 0.1s ease-out;
            pointer-events: none; /* 讓點擊穿透到 stage */
        }

        /* 提示字與版本號 */
        .ui-text {
            position: absolute;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }
        .hint { bottom: 60px; color: #8b8b7a; font-size: 14px; line-height: 1.5; }
        .version { bottom: 10px; left: 10px; color: #bcbcad; font-size: 10px; text-align: left; }

        /* 進度條 */
        #progress-bar {
            position: absolute; top: 0; left: 0; height: 6px;
            background-color: #4169E1; width: 0%; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="progress-bar"></div>
    
    <div id="main-stage">
        <div id="counter">0</div>
        
        <div class="ui-text hint">點擊螢幕 +1<br>雙指縮放數字大小<br>長按 3秒 歸零</div>
        <div class="ui-text version">v1.1</div>
    </div>

    <script>
        let count = 0;
        let currentScale = 1;
        let startScale = 1;
        let initialDist = 0;
        let holdTimer = null;
        let isHolding = false;
        let isPinching = false;
        
        const counter = document.getElementById('counter');
        const stage = document.getElementById('main-stage');
        const progressBar = document.getElementById('progress-bar');

        // --- 核心邏輯：直接監聽整個舞台 ---
        stage.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isPinching = false;
                startHolding();
            } else if (e.touches.length === 2) {
                isPinching = true;
                stopHolding();
                initialDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                startScale = currentScale;
            }
        }, { passive: false });

        stage.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const currentDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                currentScale = startScale * (currentDist / initialDist);
                // 限制範圍
                if (currentScale < 0.3) currentScale = 0.3;
                if (currentScale > 6) currentScale = 6;
                counter.style.transform = `scale(${currentScale})`;
            }
        });

        stage.addEventListener('touchend', (e) => {
            // 如果進度條跑不到 10% 且不是在縮放，則判定為點擊
            const progress = parseFloat(progressBar.style.width) || 0;
            if (!isPinching && progress < 10) {
                count++;
                counter.innerText = count;
                if (navigator.vibrate) navigator.vibrate(15);
            }
            
            stopHolding();
            // 延遲結束縮放狀態
            setTimeout(() => { isPinching = false; }, 100);
        });

        function startHolding() {
            isHolding = true;
            progressBar.style.transition = "width 3s linear";
            progressBar.style.width = "100%";
            holdTimer = setTimeout(() => {
                if (isHolding && !isPinching) {
                    if (confirm("v1.1：確定要歸零嗎？")) {
                        count = 0;
                        counter.innerText = count;
                        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                    }
                }
                stopHolding();
            }, 3000);
        }

        function stopHolding() {
            isHolding = false;
            clearTimeout(holdTimer);
            progressBar.style.transition = "none";
            progressBar.style.width = "0%";
        }
    </script>
</body>
</html>
