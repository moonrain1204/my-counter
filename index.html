<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>九字禪計數器 v6.5</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #F5F5DC; font-family: sans-serif; user-select: none; touch-action: none; }
        
        /* 頁面容器 */
        .page { position: absolute; top: 0; left: 0; width: 100%; height: 60%; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5; overflow: hidden; }
        .page.active { display: flex; }

        /* 分頁二：佛像觀想 */
        #buddha-img { max-height: 90%; will-change: transform; cursor: move; }

        /* 分頁三：讚頌經文 */
        .scripture-box { padding: 20px; text-align: center; color: #8B4513; line-height: 1.8; }
        .scripture-header { font-size: 24px; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #8B4513; padding-bottom: 5px; }
        .scripture-content { font-size: 18px; text-align: justify; word-break: break-all; }

        /* 下半部固定控制區 (佔 40%) */
        #bottom-controls { position: absolute; bottom: 0; width: 100%; height: 40%; background: rgba(255,255,255,0.3); border-top: 1px solid rgba(0,0,0,0.1); z-index: 20; }
        #counter-display { height: 60%; display: flex; justify-content: center; align-items: center; pointer-events: none; }
        #counter { color: #00008B; font-size: 80px; font-weight: bold; }

        /* 切換選單 */
        #nav-menu { position: absolute; bottom: 70px; width: 100%; display: flex; justify-content: center; gap: 15px; z-index: 100; }
        .nav-btn { padding: 5px 15px; background: #8B4513; color: white; border-radius: 20px; font-size: 14px; cursor: pointer; }

        /* 原有功能：控制鈕與資訊 */
        #audio-controls { position: absolute; left: 10px; bottom: 100px; display: flex; flex-direction: column; gap: 12px; z-index: 100; }
        .btn { width: 35px; height: 35px; background: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 1px solid #8B4513; cursor: pointer; }
        .icon-play { width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 10px solid #8B4513; }
        .icon-pause { width: 10px; height: 12px; border-left: 3px solid #8B4513; border-right: 3px solid #8B4513; }
        .icon-stop { width: 10px; height: 10px; background: #8B4513; }

        #log-toggle { position: absolute; right: 20px; top: 20px; width: 14px; height: 14px; background: rgba(112, 128, 144, 0.4); border-radius: 50%; z-index: 100; }
        .info-area { position: absolute; bottom: 10px; left: 15px; color: #8b8b7a; font-size: 12px; }
        #target-input { background: transparent; border: none; border-bottom: 1px solid #bcbcad; width: 60px; outline: none; }
        #progress-bar { position: absolute; top: 0; left: 0; height: 4px; width: 0%; z-index: 300; }
        #progress-bar.active { background: #FF4500; transition: width 0.8s linear; width: 100% !important; }
        #control-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
    </style>
</head>
<body>
    <div id="progress-bar"></div>
    <div id="log-toggle" onclick="toggleLog()"></div>

    <div id="page1" class="page active"></div>

    <div id="page2" class="page">
        <img src="buddha.png" id="buddha-img" alt="大自在王佛">
    </div>

    <div id="page3" class="page">
        <div class="scripture-box">
            <div class="scripture-header">大自在王佛讚頌</div>
            <div class="scripture-content">
                大自在王佛為眾生佛性之本元，諸佛法身之總理體，統物理界精神界之一如，法界萬有皆由之變易生化而然，其身心體、相、智、德、理、事、能、用、時、空之十大一如，與法界同一理量。
            </div>
        </div>
    </div>

    <div id="bottom-controls">
        <div id="counter-display"><div id="counter">0</div></div>
        
        <div id="audio-controls">
            <div class="btn" onclick="audioAction('play')"><div class="icon-play"></div></div>
            <div class="btn" onclick="audioAction('pause')"><div class="icon-pause"></div></div>
            <div class="btn" onclick="audioAction('stop')"><div class="icon-stop"></div></div>
        </div>

        <div id="nav-menu">
            <div class="nav-btn" onclick="switchPage(1)">計數</div>
            <div class="nav-btn" onclick="switchPage(2)">觀想</div>
            <div class="nav-btn" onclick="switchPage(3)">讚頌</div>
        </div>

        <div class="info-area">
            目標: <input type="number" id="target-input" oninput="updateEst()"> <span id="est"></span><br>
            v6.5 觀想整合版 | 長按/右鍵歸零
        </div>
    </div>

    <div id="control-layer"></div>
    <audio id="buddhaAudio"><source src="buddha_chant.mp3" type="audio/mpeg"></audio>

    <script>
        let count = 0, history = [], isTouch = false;
        let imgX = 0, imgY = 0, imgS = 1; // 佛像縮放位移變數
        const audio = document.getElementById('buddhaAudio');
        const img = document.getElementById('buddha-img');

        // 初始化
        count = parseInt(localStorage.getItem('myCounter')) || 0;
        document.getElementById('target-input').value = localStorage.getItem('myTarget') || "";
        audio.addEventListener('ended', () => { audio.currentTime = 0; audio.play(); });

        function switchPage(p) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.getElementById('page' + p).classList.add('active');
        }

        function audioAction(act) {
            if(act==='play') audio.play();
            else if(act==='pause') audio.pause();
            else { audio.pause(); audio.currentTime = 0; }
        }

        function updateDisplay() {
            document.getElementById('counter').innerText = count;
            localStorage.setItem('myCounter', count);
            updateEst();
        }

        function updateEst() {
            const t = parseInt(document.getElementById('target-input').value);
            localStorage.setItem('myTarget', t || "");
            const res = document.getElementById('est');
            if(!t || t <= count) { res.innerText = ""; return; }
            let s = 9; if(history.length >= 2) s = (new Date(history[0].time)-new Date(history[1].time))/500000;
            const d = new Date(Date.now() + (t-count)*s*1000);
            res.innerText = `預計: ${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`;
        }

        // 觸控邏輯 (計數與佛像移動)
        let startT = 0, holdT, visualT, lastX, lastY, startDist, isDraggingImg = false;

        document.getElementById('control-layer').addEventListener('touchstart', (e) => {
            isTouch = true;
            if(e.target.tagName === 'INPUT') return;
            e.preventDefault();
            startT = Date.now();

            if(e.touches.length === 1) {
                // 如果在分頁二，且點擊到上半部，準備移動佛像
                if(document.getElementById('page2').classList.contains('active') && e.touches[0].pageY < window.innerHeight * 0.6) {
                    isDraggingImg = true;
                    lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
                }
                holdT = setTimeout(() => { if(confirm("歸零？")) {count=0; updateDisplay();} }, 3500);
                visualT = setTimeout(() => { document.getElementById('progress-bar').classList.add('active'); }, 500);
            } else if(e.touches.length === 2 && isDraggingImg) {
                startDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            }
        }, {passive: false});

        document.getElementById('control-layer').addEventListener('touchmove', (e) => {
            if(isDraggingImg) {
                if(e.touches.length === 1) {
                    imgX += (e.touches[0].pageX - lastX);
                    imgY += (e.touches[0].pageY - lastY);
                    lastX = e.touches[0].pageX; lastY = e.touches[0].pageY;
                } else if(e.touches.length === 2) {
                    let d = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    imgS *= (d / startDist);
                    startDist = d;
                }
                img.style.transform = `translate(${imgX}px, ${imgY}px) scale(${imgS})`;
            }
        });

        document.getElementById('control-layer').addEventListener('touchend', (e) => {
            if(!isDraggingImg && (Date.now() - startT) < 400) { count++; updateDisplay(); }
            isDraggingImg = false;
            clearTimeout(holdT); clearTimeout(visualT);
            document.getElementById('progress-bar').classList.remove('active');
        });

        // 滑鼠邏輯
        document.getElementById('control-layer').addEventListener('mousedown', (e) => {
            if(isTouch || e.target.tagName === 'INPUT' || e.target.closest('.btn')) return;
            if(e.button === 0) { count++; updateDisplay(); }
            else if(e.button === 2) { if(confirm("歸零？")) {count=0; updateDisplay();} }
        });

        document.addEventListener('contextmenu', e => e.preventDefault());
        updateDisplay();
    </script>
</body>
</html>
