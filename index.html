<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>專業計數器 v1.7</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #F5F5DC; 
            font-family: sans-serif; user-select: none; touch-action: none;
        }
        #display-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; z-index: 1;
        }
        #counter { color: #00008B; font-size: 100px; font-weight: bold; transition: transform 0.1s ease-out; }
        #control-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; }
        .ui-text { position: absolute; width: 100%; text-align: center; pointer-events: none; z-index: 5; }
        .hint { bottom: 60px; color: #8b8b7a; font-size: 14px; }
        .version { bottom: 10px; left: 10px; color: #bcbcad; font-size: 10px; text-align: left; }
        #progress-bar { position: absolute; top: 0; left: 0; height: 6px; background-color: #4169E1; width: 0%; z-index: 100; }
    </style>
</head>
<body>
    <div id="progress-bar"></div>
    <div id="display-layer"><div id="counter">0</div></div>
    <div id="control-layer"></div>
    <div class="ui-text hint">單指點擊 +1<br>雙指縮放大小<br>長按 3秒 歸零</div>
    <div class="ui-text version">v1.7 Samsung 震動優化版</div>

    <script>
        let count = parseInt(localStorage.getItem('myCounter')) || 0;
        let currentScale = 1;
        let startScale = 1;
        let initialDist = 0;
        let holdTimer = null;
        let isHolding = false;
        let isPinching = false;
        let startTime = 0;

        const counter = document.getElementById('counter');
        const control = document.getElementById('control-layer');
        const progressBar = document.getElementById('progress-bar');

        counter.innerText = count;

        // 封裝震動函式，增加相容性判定
        function doVibrate(pattern) {
            if (window.navigator && window.navigator.vibrate) {
                // 某些手機需要先停止當前震動再開啟新的
                window.navigator.vibrate(0);
                window.navigator.vibrate(pattern);
            }
        }

        window.addEventListener('beforeunload', (e) => {
            if (count > 0) { e.preventDefault(); e.returnValue = ''; }
        });

        control.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startTime = Date.now();
            if (e.touches.length === 1) {
                isPinching = false;
                startHolding();
            } else if (e.touches.length === 2) {
                isPinching = true;
                stopHolding();
                initialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                startScale = currentScale;
            }
        }, { passive: false });

        control.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const currentDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                currentScale = startScale * (currentDist / initialDist);
                currentScale = Math.min(Math.max(currentScale, 0.2), 8);
                counter.style.transform = `scale(${currentScale})`;
            }
        });

        control.addEventListener('touchend', (e) => {
            const duration = Date.now() - startTime;
            if (!isPinching && duration < 500) {
                count++;
                updateDisplay();
                doVibrate(30); // 稍微加長點擊震動
            }
            stopHolding();
            setTimeout(() => { isPinching = false; }, 200);
        });

        function updateDisplay() {
            counter.innerText = count;
            localStorage.setItem('myCounter', count);
        }

        function startHolding() {
            isHolding = true;
            progressBar.style.transition = "width 3s linear";
            progressBar.style.width = "100%";
            holdTimer = setTimeout(() => {
                if (isHolding && !isPinching) {
                    // 彈窗瞬間震動警告 (加強至 200ms)
                    doVibrate(200); 
                    
                    if (confirm("確定要將計數器歸零嗎？")) {
                        count = 0;
                        updateDisplay();
                        // 歸零成功 (長-短-長)
                        doVibrate([400, 150, 400]);
                    }
                }
                stopHolding();
            }, 3000);
        }

        function stopHolding() {
            isHolding = false;
            if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
            progressBar.style.transition = "none";
            progressBar.style.width = "0%";
        }
    </script>
</body>
</html>
