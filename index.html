<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>九字禪計數器 v3.7</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #F5F5DC; font-family: sans-serif; user-select: none; touch-action: none; }
        
        /* 頂部控制列：改用 space-around 讓兩端空白均等 */
        #header-controls { 
            position: absolute; 
            top: 15px; 
            width: 100%; 
            padding: 0 5px; /* 縮減內距，由 space-around 決定留白 */
            display: flex; 
            justify-content: space-around; /* 關鍵：讓聖號左側與按鈕右側有相等的留白 */
            align-items: center; 
            z-index: 100; 
        }
        
        #sacred-text { 
            color: #8B4513; 
            font-family: "DFKai-SB", "DFKaiShu-W7", "DFP-ExtraBold-Kaiti", "華康特粗楷體", "標楷體", serif; 
            font-size: 19px; 
            font-weight: 900; 
            letter-spacing: 0.5px; 
            text-shadow: 0.5px 0.5px 1px rgba(255,255,255,0.8);
            line-height: 1.2;
            white-space: nowrap;
        }
        
        #log-toggle { 
            padding: 8px 14px; 
            background: rgba(65, 105, 225, 0.8); 
            color: white; 
            border-radius: 20px; 
            font-size: 13px; 
            cursor: pointer; 
            backdrop-filter: blur(4px); 
            white-space: nowrap;
            line-height: 1.2;
            display: flex;
            align-items: center;
        }

        #display-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; pointer-events: none; z-index: 1; }
        #counter { color: #00008B; font-size: 100px; font-weight: bold; pointer-events: none; transition: transform 0.1s ease-out; }
        
        #log-panel { position: absolute; top: 0; right: -100%; width: 95%; height: 100%; background: #fff; z-index: 150; transition: right 0.3s ease-out; padding: 20px; overflow-y: auto; }
        #log-panel.active { right: 0; }
        .log-item { border-bottom: 1px solid #eee; padding: 12px 0; }
        .log-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .log-type { font-size: 14px; color: #4169E1; font-weight: bold; }
        .log-time { font-size: 13px; color: #666; font-family: monospace; flex-grow: 1; text-align: right; }
        .log-val { font-size: 26px; font-weight: bold; color: #333; margin-top: 5px; }
        
        #control-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        .ui-text { position: absolute; width: 100%; text-align: center; pointer-events: none; z-index: 5; }
        .hint { bottom: 60px; color: #8b8b7a; font-size: 14px; }
        #progress-bar { position: absolute; top: 0; left: 0; height: 6px; background-color: transparent; width: 0%; z-index: 200; }
        #progress-bar.active { background-color: #FF4500; transition: width 0.8s linear; width: 100% !important; }
    </style>
</head>
<body>
    <div id="progress-bar"></div>
    <div id="header-controls">
        <div id="sacred-text">南無本師大自在王佛</div>
        <div id="log-toggle">查看紀錄清單</div>
    </div>

    <div id="log-panel">
        <div id="log-close" style="text-align:right; font-size:35px; cursor:pointer; padding:10px;">✕</div>
        <div style="font-size:20px; font-weight:bold; border-bottom:3px solid #4169E1; padding-bottom:10px; margin-bottom:15px;">九字禪 修持歷程</div>
        <div id="log-content"></div>
    </div>

    <div id="display-layer"><div id="counter">0</div></div>
    <div id="control-layer"></div>
    <div class="ui-text hint">雙指縮放數字 / 長按 3秒 歸零 (不刪紀錄)</div>

    <script>
        // (JavaScript 部分保持 v3.6 的穩定邏輯，確保年份 2025 與紀錄保存)
        let count = parseInt(localStorage.getItem('myCounter')) || 0;
        let history = JSON.parse(localStorage.getItem('myHistory')) || [];
        let currentScale = 1, startScale = 1, initialDist = 0;
        let holdTimer, visualTimer, isHolding = false, isPinching = false, startTime = 0;

        const counter = document.getElementById('counter');
        const logContent = document.getElementById('log-content');

        function doVibrate(p) { if(navigator.vibrate) { navigator.vibrate(0); navigator.vibrate(p); } }

        function updateDisplay() {
            counter.innerText = count;
            localStorage.setItem('myCounter', count);
            if (count > 0 && count % 500 === 0) saveToHistory();
        }

        function saveToHistory() {
            const now = new Date();
            const dateStr = "2025/" + (now.getMonth()+1).toString().padStart(2,'0') + "/" + now.getDate().toString().padStart(2,'0');
            const timeStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0') + ":" + now.getSeconds().toString().padStart(2,'0');
            history.unshift({ count: count, time: dateStr + " " + timeStr });
            if (history.length > 200) history.pop();
            localStorage.setItem('myHistory', JSON.stringify(history));
            doVibrate(250);
        }

        function renderHistory() {
            logContent.innerHTML = history.map(item => {
                let val = typeof item === 'string' ? (item.match(/\d+/) || [""])[0] : (item.count || "");
                let fullTime = typeof item === 'string' ? item : (item.time || "");
                fullTime = fullTime.replace(/[★大關卡達標紀錄:：\n\r]/g, "").replace(val, "").trim();
                let parts = fullTime.split(' ');
                let timePart = parts[parts.length - 1];
                if (timePart && timePart.length === 6 && !timePart.includes(':')) {
                    let fixed = timePart.substring(0,2) + ":" + timePart.substring(2,4) + ":" + timePart.substring(4,6);
                    fullTime = fullTime.replace(timePart, fixed);
                }
                fullTime = fullTime.replace(/114\//g, "2025/").replace(/2014\//g, "2025/");
                if (fullTime && !fullTime.includes("2025/")) fullTime = "2025/" + fullTime;
                fullTime = fullTime.replace(/\/+/g, "/").replace(/\s+/g, " ");
                return `<div class="log-item">
                    <div class="log-row">
                        <span class="log-type">達標</span>
                        <span class="log-time">${fullTime}</span>
                    </div>
                    <div class="log-val">${val}</div>
                </div>`;
            }).join('');
        }

        document.getElementById('log-toggle').onclick = () => { document.getElementById('log-panel').classList.add('active'); renderHistory(); };
        document.getElementById('log-close').onclick = () => { document.getElementById('log-panel').classList.remove('active'); };

        const control = document.getElementById('control-layer');
        control.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startTime = Date.now();
            if (e.touches.length === 1) { isPinching = false; startHolding(); }
            else if (e.touches.length === 2) {
                isPinching = true; stopHolding();
                initialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                startScale = currentScale;
            }
        }, { passive: false });

        control.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                currentScale = Math.min(Math.max(startScale * (dist / initialDist), 0.2), 8);
                counter.style.transform = `scale(${currentScale})`;
            }
        });

        control.addEventListener('touchend', (e) => {
            if (!isPinching && (Date.now() - startTime) < 400) { count++; updateDisplay(); doVibrate(40); }
            stopHolding();
        });

        function startHolding() {
            isHolding = true;
            holdTimer = setTimeout(() => {
                if (isHolding && !isPinching && confirm("確定要將目前數字歸零嗎？(歷史紀錄將被保存)")) { count = 0; updateDisplay(); }
                stopHolding();
            }, 3500);
            visualTimer = setTimeout(() => { if(isHolding) document.getElementById('progress-bar').classList.add('active'); }, 2800);
        }

        function stopHolding() { isHolding = false; clearTimeout(holdTimer); clearTimeout(visualTimer); document.getElementById('progress-bar').classList.remove('active'); }

        updateDisplay();
    </script>
</body>
</html>
