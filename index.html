<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>九字禪計數器 v5.7</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #F5F5DC; font-family: sans-serif; user-select: none; touch-action: none; }
        
        #header-controls { 
            position: absolute; top: 20px; width: 100%; 
            display: flex; justify-content: center; align-items: center; z-index: 100; 
        }
        
        #sacred-text { 
            color: #8B4513; 
            font-family: "華康特粗楷體", "DFKai-SB", "標楷體", serif; 
            font-size: 20px; font-weight: 900; letter-spacing: 2px; 
            -webkit-text-stroke: 0.8px #8B4513; 
            line-height: 1.2; white-space: nowrap; text-align: center;
        }
        
        #log-toggle { 
            position: absolute; right: 20px; top: 0px;
            width: 12px; height: 12px; background: rgba(112, 128, 144, 0.4); 
            border-radius: 50%; cursor: pointer; backdrop-filter: blur(2px);
            border: 1px solid rgba(0,0,0,0.1);
        }

        #display-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; pointer-events: none; z-index: 1; }
        #counter { color: #00008B; font-size: 100px; font-weight: bold; position: relative; will-change: transform; }
        
        #log-panel { position: absolute; top: 0; right: -100%; width: 100%; height: 100%; background: #fff; z-index: 150; transition: right 0.3s ease-out; padding: 20px; overflow-y: auto; }
        #log-panel.active { right: 0; }
        
        #control-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; background: transparent; }
        
        .bottom-bar { 
            position: absolute; bottom: 10px; width: 100%; padding: 0 15px;
            display: flex; justify-content: space-between; align-items: flex-end;
            pointer-events: none; z-index: 5;
        }
        .left-group { display: flex; flex-direction: column; gap: 12px; pointer-events: auto; }
        .mini-info { color: #bcbcad; font-size: 10px; font-family: sans-serif; }
        
        .target-area { display: flex; align-items: center; gap: 5px; color: #bcbcad; font-size: 13px; }
        #target-input {
            background: rgba(255, 255, 255, 0.3); border: none; border-bottom: 1.5px solid #bcbcad;
            color: #8b8b7a; font-size: 14px; width: 70px; outline: none; padding: 2px 5px;
            border-radius: 2px; caret-color: #8B4513;
        }
        #est-result { color: #8b8b7a; font-weight: bold; }

        #progress-bar { position: absolute; top: 0; left: 0; height: 6px; background-color: transparent; width: 0%; z-index: 200; }
        #progress-bar.active { background-color: #FF4500; transition: width 0.8s linear; width: 100% !important; }
    </style>
</head>
<body>
    <div id="progress-bar"></div>
    <div id="header-controls">
        <div id="sacred-text">南無本師大自在王佛</div>
        <div id="log-toggle"></div>
    </div>

    <div id="display-layer"><div id="counter">0</div></div>
    <div id="control-layer"></div>

    <div id="log-panel">
        <div id="log-close" style="text-align:right; font-size:35px; cursor:pointer; padding:10px;">✕</div>
        <div style="font-size:20px; font-weight:bold; border-bottom:3px solid #708090; padding-bottom:10px; margin-bottom:15px;">九字禪 修持歷程</div>
        <div id="log-content"></div>
        <button onclick="clearAllHistory()" style="width:100%; margin-top:30px; padding:15px; background:#ff4444; color:white; border:none; border-radius:10px; font-size:16px; font-weight:bold;">清空所有歷史紀錄</button>
    </div>

    <div class="bottom-bar">
        <div class="left-group">
            <div class="target-area">
                目標: <input type="number" id="target-input" oninput="updateEstimation()"> 
                <span id="est-result"></span>
            </div>
            <div class="mini-info">v5.7 完整功能版</div>
        </div>
        <div class="mini-info">長按可歸零</div>
    </div>

    <script>
        let count = 0;
        let history = [];
        let posX = 0, posY = 0, currentScale = 1;

        try {
            count = parseInt(localStorage.getItem('myCounter')) || 0;
            let rawHistory = JSON.parse(localStorage.getItem('myHistory')) || [];
            history = rawHistory.filter(item => item && item.count !== undefined && item.time !== undefined);
            const savedTarget = localStorage.getItem('myTarget');
            if(savedTarget) document.getElementById('target-input').value = savedTarget;
        } catch (e) { history = []; }

        const counter = document.getElementById('counter');
        const logContent = document.getElementById('log-content');

        function updateDisplay() {
            counter.innerText = count;
            localStorage.setItem('myCounter', count);
            applyTransform();
            updateEstimation();
        }

        function applyTransform() {
            counter.style.transform = `translate(${posX}px, ${posY}px) scale(${currentScale})`;
        }

        function updateEstimation() {
            const target = parseInt(document.getElementById('target-input').value);
            const resSpan = document.getElementById('est-result');
            localStorage.setItem('myTarget', target || "");
            
            if (!target || target <= count) { resSpan.innerText = ""; return; }

            let secondsPerUnit = 9; 
            const remaining = target - count;

            if (count >= 500 && history.length >= 2) {
                try {
                    const latest = new Date(history[0].time);
                    const previous = new Date(history[1].time);
                    const diffMs = latest - previous;
                    if (diffMs > 0) secondsPerUnit = (diffMs / 1000) / 500;
                } catch(e) {}
            }

            const totalSecondsNeeded = remaining * secondsPerUnit;
            const targetDate = new Date(Date.now() + totalSecondsNeeded * 1000);
            resSpan.innerText = `預計: ${targetDate.getMonth()+1}/${targetDate.getDate()} ${targetDate.getHours().toString().padStart(2,'0')}:${targetDate.getMinutes().toString().padStart(2,'0')}`;
        }

        function clearAllHistory() {
            if (confirm("確定要刪除所有歷史紀錄嗎？")) {
                history = [];
                localStorage.setItem('myHistory', JSON.stringify(history));
                renderHistory();
                updateEstimation();
            }
        }

        function renderHistory() {
            if (history.length === 0) {
                logContent.innerHTML = "<div style='text-align:center; color:#999; margin-top:50px;'>尚無有效紀錄</div>";
                return;
            }
            logContent.innerHTML = history.map(item => `
                <div style="border-bottom:1px solid #eee; padding:12px 0;">
                    <div style="display:flex; justify-content:space-between; font-size:13px; color:#888;">
                        <span style="color:#708090; font-weight:bold;">達標</span>
                        <span>${item.time}</span>
                    </div>
                    <div style="font-size:26px; font-weight:bold; color:#333; margin-top:5px;">${item.count}</div>
                </div>`).join('');
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                speechSynthesis.speak(utterance);
            }
        }

        document.getElementById('log-toggle').onclick = () => { document.getElementById('log-panel').classList.add('active'); renderHistory(); };
        document.getElementById('log-close').onclick = () => { document.getElementById('log-panel').classList.remove('active'); };

        let startScale = 1, initialDist = 0;
        let holdTimer, visualTimer, dragModeTimer;
        let isHolding = false, isPinching = false, isDragging = false;
        let startTime = 0, lastTouchX = 0, lastTouchY = 0;

        const control = document.getElementById('control-layer');
        control.addEventListener('touchstart', (e) => {
            if (e.target.id === 'target-input') return;
            e.preventDefault();
            startTime = Date.now();
            
            if (e.touches.length === 1) { 
                isPinching = false; isHolding = true; isDragging = false;
                holdTimer = setTimeout(() => {
                    if (isHolding && !isPinching && !isDragging) {
                        if(navigator.vibrate) navigator.vibrate(80); 
                        speak("請問是否要歸零？");
                        setTimeout(() => { if (confirm("確定要將目前數字歸零嗎？")) { count = 0; updateDisplay(); } }, 150);
                    }
                    isHolding = false; document.getElementById('progress-bar').classList.remove('active');
                }, 3500);
                visualTimer = setTimeout(() => { if(isHolding) document.getElementById('progress-bar').classList.add('active'); }, 2800);
            } 
            else if (e.touches.length === 2) {
                isPinching = true; isHolding = false; clearTimeout(holdTimer);
                initialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                startScale = currentScale;
                lastTouchX = (e.touches[0].pageX + e.touches[1].pageX) / 2;
                lastTouchY = (e.touches[0].pageY + e.touches[1].pageY) / 2;
                
                // 兩指長按2秒觸發拖曳模式
                dragModeTimer = setTimeout(() => {
                    if (isPinching) { isDragging = true; if(navigator.vibrate) navigator.vibrate(30); }
                }, 2000);
            }
        }, { passive: false });

        control.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                // 處理縮放
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                currentScale = Math.min(Math.max(startScale * (dist / initialDist), 0.2), 8);
                
                // 處理拖曳
                const currentTouchX = (e.touches[0].pageX + e.touches[1].pageX) / 2;
                const currentTouchY = (e.touches[0].pageY + e.touches[1].pageY) / 2;
                if (isDragging) {
                    posX += (currentTouchX - lastTouchX);
                    posY += (currentTouchY - lastTouchY);
                }
                lastTouchX = currentTouchX;
                lastTouchY = currentTouchY;
                applyTransform();
            }
        });

        control.addEventListener('touchend', (e) => {
            if (e.target.id === 'target-input') return;
            if (!isPinching && !isDragging && (Date.now() - startTime) < 400) { 
                count++; updateDisplay(); 
                if (count > 0 && count % 500 === 0) {
                    const now = new Date();
                    const timeStr = `${now.getFullYear()}/${(now.getMonth()+1)}/${now.getDate()} ${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}`;
                    history.unshift({ count: count, time: timeStr });
                    localStorage.setItem('myHistory', JSON.stringify(history));
                }
            }
            isHolding = false; isPinching = false; isDragging = false;
            clearTimeout(holdTimer); clearTimeout(visualTimer); clearTimeout(dragModeTimer);
            document.getElementById('progress-bar').classList.remove('active');
        });

        updateDisplay();
    </script>
</body>
</html>
