<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>專業計數器 v0.3</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #F5F5DC; 
            color: #333;
            font-family: sans-serif;
            user-select: none;
            touch-action: none;
        }

        #counter {
            color: #00008B; 
            font-size: 15rem;
            font-weight: bold;
        }

        .hint {
            position: absolute;
            bottom: 45px;
            text-align: center;
            color: #8b8b7a;
            font-size: 0.8rem;
            line-height: 1.5;
        }

        .version {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #bcbcad;
            font-size: 0.7rem;
        }

        #progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 6px;
            background-color: #4169E1;
            width: 0%;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="progress-bar"></div>
    <div id="counter">0</div>
    
    <div class="hint">單擊螢幕 +1<br>長按音量鍵或螢幕中央 3秒 歸零</div>
    <div class="version">v0.3</div>

    <script>
        let count = 0;
        let holdTimer = null;
        let isHolding = false;
        const counterDisplay = document.getElementById('counter');
        const progressBar = document.getElementById('progress-bar');

        // --- 核心逻辑：啟動歸零倒數 ---
        function startHolding() {
            if (isHolding) return;
            isHolding = true;
            
            progressBar.style.transition = "width 3s linear"; // 改為 3 秒更直覺
            progressBar.style.width = "100%";

            holdTimer = setTimeout(() => {
                resetCounter();
                stopHolding();
            }, 3000);
        }

        function stopHolding() {
            isHolding = false;
            clearTimeout(holdTimer);
            progressBar.style.transition = "none";
            progressBar.style.width = "0%";
        }

        function resetCounter() {
            if (confirm("v0.3：確定要歸零嗎？")) {
                count = 0;
                counterDisplay.innerText = count;
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            }
        }

        // --- 監聽方式 1：螢幕觸控 ---
        window.addEventListener('touchstart', (e) => {
            e.preventDefault();
            // 開始長按計時
            startHolding();
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            // 如果按住時間不夠長就放開，則執行 +1
            if (isHolding) {
                const timeHeld = parseFloat(getComputedStyle(progressBar).width);
                if (timeHeld < window.innerWidth * 0.9) { // 未滿 90% 進度
                    count++;
                    counterDisplay.innerText = count;
                    if (navigator.vibrate) navigator.vibrate(15);
                }
            }
            stopHolding();
        });

        // --- 監聽方式 2：音量鍵 (Android 相容性增強) ---
        window.addEventListener('keydown', (e) => {
            if (e.key === "VolumeUp" || e.key === "VolumeDown" || e.keyCode === 24 || e.keyCode === 25) {
                e.preventDefault();
                startHolding();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === "VolumeUp" || e.key === "VolumeDown" || e.keyCode === 24 || e.keyCode === 25) {
                stopHolding();
            }
        });
    </script>
</body>
</html>
